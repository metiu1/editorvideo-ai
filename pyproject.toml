[project]
# Il nome sul pacchetto e' "vedit-mcp" e non "vedit" perche' su PyPI "vedit" era
# gia' preso da un altro progetto. Non e' solo un ripiego: coincidendo con il
# comando del server MCP, `uvx vedit-mcp` funziona senza --from, ed e' la riga
# che si incolla nella configurazione di qualunque client. Il modulo Python
# importabile resta `vedit`.
name = "vedit-mcp"
version = "0.1.0"
description = "Editor video non lineare guidabile da un agente (MCP), con interfaccia web. Timeline -> ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["video", "editing", "ffmpeg", "mcp", "timeline", "nle"]
authors = [{ name = "metiu1" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Italian",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/metiu1/editorvideo-ai"
Source = "https://github.com/metiu1/editorvideo-ai"
Issues = "https://github.com/metiu1/editorvideo-ai/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# serve solo per l'assistente dentro la UI; senza, il resto funziona uguale
chat = ["anthropic>=0.40"]

[project.scripts]
vedit = "vedit.cli:main"
vedit-mcp = "vedit.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# L'interfaccia compilata viaggia dentro il pacchetto: chi installa da PyPI non
# ha Node per compilarla. La copia scripts/build_wheel.py da frontend/dist.
[tool.setuptools.package-data]
vedit = ["webui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: esegue ffmpeg per davvero (render reali)"]
