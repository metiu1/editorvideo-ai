# Test a ogni push e a ogni pull request.
#
# Serve anche al rilascio: release.yml richiama questo workflow con
# `workflow_call`, cosi' su PyPI non finisce niente che non sia passato di qui.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg non e' un pacchetto Python: senza, non gira nemmeno la suite
      # veloce, che i suoi sorgenti sintetici se li genera da sola.
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: dipendenze
        run: python -m pip install -e ".[dev]"

      - name: doctor
        run: vedit doctor

      # sui runner non c'e' GPU: gli encoder hardware non ci sono e si ripiega
      # su libx264. E' esattamente il caso di chi non ha una scheda video.
      - name: test
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: dipendenze
        working-directory: frontend
        run: npm ci

      # i test della UI montano il bundle compilato: prima si compila
      - name: compila
        working-directory: frontend
        run: npm run build

      - name: test
        working-directory: frontend
        run: npm test
